name: CI

# Runs on every push and, for pull requests from forks, on the pull request.
# A pull request from a branch of this repository is already covered by the
# push, so those jobs are skipped to avoid running everything twice.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: Test (${{ matrix.os }})
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      - name: go test with the race detector (Linux and macOS)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: go test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  # The permission checks must also work for a user who is not root; the
  # hosted runners run as a normal user, so this is exercised above. This job
  # makes it explicit by failing if the "read-only folder" test was skipped on
  # Linux.
  permission-test-not-skipped:
    name: Permission test runs on Linux
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - name: Run the read-only folder test and fail if it was skipped
        run: |
          go test -count=1 -v -run 'TestWriteAccessFailsInAReadOnlyFolder' ./internal/checks/ | tee perm.log
          if grep -q -e '--- SKIP' perm.log; then echo '::error::the read-only folder test was skipped, so it proved nothing'; exit 1; fi

  examples:
    name: Example manifests are valid
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - name: Validate every manifest in examples/
        run: |
          go build -o /tmp/stellatinus-installer ./cmd/stellatinus-installer
          for f in examples/*.json; do /tmp/stellatinus-installer validate "$f"; done
      - name: The accent colours in the examples are legible
        run: |
          for f in examples/*.json; do
            c=$(grep -o '"accent": *"#[0-9a-fA-F]\{6\}"' "$f" | grep -o '#[0-9a-fA-F]\{6\}')
            /tmp/stellatinus-installer accent "$c"
          done

  pinned-actions:
    name: Actions are pinned by commit hash
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail on any action that is not pinned by a 40-character hash
        run: |
          bad=$(grep -rnE '^\s*-?\s*uses:' .github/workflows | grep -vE 'uses: [^@]+@[0-9a-f]{40}( |$)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo '::error::pin every action by commit hash with the version in a comment (see docs/decisions.md)'
            exit 1
          fi

  vulncheck:
    name: Known vulnerabilities in dependencies
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # Build the command line for every system we target and keep the result as a
  # workflow artifact for 14 days. There are no releases and no packages yet:
  # nothing consumes them (see docs/decisions.md).
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test, examples]
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Go 1.26.0 has a standard-library vulnerability fixed in 1.26.1
          # (GO-2026-4602); "1.26" with check-latest takes the newest patch.
          # See docs/decisions.md.
          go-version: "1.26"
          check-latest: true
      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" \
            -o "dist/stellatinus-installer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/stellatinus-installer
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stellatinus-installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # The test installers: the demo app packed into a single-file installer for
  # every system, and the plain command line, published on a rolling
  # pre-release (the tag "test-builds" moves to the latest commit of main) so a
  # person with no GitHub account can download them. They are UNSIGNED. Only
  # this job can write to the repository, only for a push to main of this
  # repository, never for a pull request (see docs/decisions.md).
  test-builds:
    name: Publish the test installers
    needs: [lint, test, examples, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Stellatinus/Stellatinus-Installer' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: Build the demo program for every system
        run: |
          set -eu
          mkdir -p demobin
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "demobin/stellatinus-demo-$os-$arch$ext" ./tools/demoapp
          done
      - name: Make the demo payload and fill its hashes into the manifest
        run: go run ./tools/demo --manifest examples/stellatinus-demo.json --bin-dir demobin --out payload
      - name: Build and pack for every system
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            engine="dist/stellatinus-installer-$os-$arch$ext"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=test-${GITHUB_SHA::7}" -o "$engine" ./cmd/stellatinus-installer
            # The packer runs on this machine; any engine can be packed into.
            go run ./cmd/stellatinus-installer pack --engine "$engine" --manifest payload/manifest.json --out "dist/Stellatinus-Demo-Setup-$os-$arch$ext"
          done
          cp payload/demo-app-*.zip payload/demo-model.bin dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Publish on the rolling pre-release
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          **Unsigned test builds of the Stellatinus installer, replaced on every push to `main`.** For trying it, not for real use.

          - `Stellatinus-Demo-Setup-<system>-<arch>` is a fake app packed into a single-file installer: double-click it, or run it with `--help`. It shows what it will do and asks first. `stellatinus-installer-<system>-<arch>` is the plain command line.
          - **Windows** SmartScreen and Defender will warn that the publisher is unknown: choose *More info*, then *Run anyway*. **macOS** Gatekeeper refuses it: make it executable (`chmod +x`), then open it from the context menu (*Open*) once. Both are expected until the installers are signed.
          - `SHA256SUMS.txt` has the checksum of every file. `demo-app-*.zip` and `demo-model.bin` are what the demo downloads; do not run them.
          NOTES
          if ! gh release view test-builds >/dev/null 2>&1; then
            gh release create test-builds --prerelease --title "Test installers (unsigned, rolling)" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          git tag -f test-builds "$GITHUB_SHA"
          git push -f origin refs/tags/test-builds
          gh release edit test-builds --prerelease --title "Test installers (unsigned, rolling)" --notes-file notes.md
          gh release upload test-builds dist/* --clobber
