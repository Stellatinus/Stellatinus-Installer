name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version, and how you ran the program.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `stellatinus-installer version`.
  - type: textarea
    id: logs
    attributes:
      label: Output or log
      render: text
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it is fixed.
